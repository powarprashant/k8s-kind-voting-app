name: CI
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 590183746102.dkr.ecr.us-east-1.amazonaws.com
  # One repository per service: demo-app-vote, demo-app-result, demo-app-worker
  ECR_REPO_PREFIX: demo-app-

jobs:

  code-scan:
    name: Code scan (Trivy fs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy scan - vulnerabilities & secrets (blocking)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table


      - name: Trivy scan - misconfiguration (advisory)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '0'
          format: table


  build-scan-push:
    name: Build / Scan / Push (${{ matrix.service }})
    needs: code-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required to request the GitHub OIDC token for AWS
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: vote
            context: vote
            target: final
          - service: result
            context: result
            target: ''
          - service: worker
            context: worker
            target: ''
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: ${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}


      - name: Trivy image scan - CRITICAL (blocking)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ matrix.service }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table


      - name: Trivy image scan - HIGH (advisory)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ matrix.service }}:scan
          severity: HIGH
          ignore-unfixed: true
          exit-code: '0'
          format: table

      - name: Configure AWS credentials (OIDC)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        if: github.event_name != 'pull_request'
        run: |
          repo="${ECR_REPO_PREFIX}${{ matrix.service }}"
          aws ecr describe-repositories --repository-names "$repo" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$repo" \
                 --image-scanning-configuration scanOnPush=true

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_PREFIX }}${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short


      - name: Push image to Amazon ECR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuses the layers built above - this step is near-instant.
          cache-from: type=gha,scope=${{ matrix.service }}

          provenance: false
          sbom: false
