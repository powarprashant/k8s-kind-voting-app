name: CI
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:

  IMAGE_NAMESPACE: prashantkpowar
  IMAGE_PREFIX: k8s-voting- 

jobs:

  code-scan:
    name: Code scan (Trivy fs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
    
      - name: Trivy scan - vulnerabilities & secrets (blocking)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table


      - name: Trivy scan - misconfiguration (advisory)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '0'
          format: table


  build-scan-push:
    name: Build / Scan / Push (${{ matrix.service }})
    needs: code-scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: vote
            context: vote
            target: final
          - service: result
            context: result
            target: ''
          - service: worker
            context: worker
            target: ''
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Docker Hub image name
        id: img
        env:
          NS: ${{ vars.DOCKERHUB_NAMESPACE || env.IMAGE_NAMESPACE }}
        run: |
          ns="$(printf '%s' "$NS" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          echo "name=${ns}/${IMAGE_PREFIX}${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          echo "Image name: ${ns}/${IMAGE_PREFIX}${{ matrix.service }}"

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

     
      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: ${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}


      - name: Trivy image scan - CRITICAL (blocking)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ matrix.service }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table


      - name: Trivy image scan - HIGH (advisory)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ matrix.service }}:scan
          severity: HIGH
          ignore-unfixed: true
          exit-code: '0'
          format: table

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuses the layers built above - this step is near-instant.
          cache-from: type=gha,scope=${{ matrix.service }}

          provenance: false
          sbom: false

