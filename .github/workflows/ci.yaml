name: CI

# Single CI pipeline for the voting app:
#   1. code-scan  -> Trivy filesystem scan (vulns, secrets, misconfig) on the source
#   2. build      -> docker build each service image (vote / result / worker)
#   3. image-scan -> Trivy scan of the built image (fails on CRITICAL/HIGH)
#   4. push       -> push to Docker Hub (only on push to main, not on PRs)
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  - your Docker Hub username
#   DOCKERHUB_TOKEN     - a Docker Hub access token (Account Settings -> Security)

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Change this prefix to whatever you want your images called on Docker Hub.
  # Final image name = <DOCKERHUB_USERNAME>/<IMAGE_PREFIX><service>
  IMAGE_PREFIX: k8s-voting-
  IMAGE_NAMESPACE: prashantkpowar

jobs:
  # ------------------------------------------------------------------
  # 1. Static code / dependency / secret scan of the repository
  # ------------------------------------------------------------------
  code-scan:
    name: Code scan (Trivy fs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dependency vulnerabilities + hard-coded secrets -> these BLOCK the pipeline.
      - name: Trivy scan - vulnerabilities & secrets (blocking)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

      # IaC / Dockerfile hardening findings -> reported for visibility, do NOT block.
      # (k8s manifests here are demo-grade; harden them before any production use.)
      - name: Trivy scan - misconfiguration (advisory)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '0'
          format: table

  # ------------------------------------------------------------------
  # 2-4. Build -> scan image -> push, once per service via a matrix
  # ------------------------------------------------------------------
  build-scan-push:
    name: Build / Scan / Push (${{ matrix.service }})
    needs: code-scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: vote
            context: vote
            target: final
          - service: result
            context: result
            target: ''
          - service: worker
            context: worker
            target: ''
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Docker Hub namespace for the image. Do NOT reuse the login secret here -
      # that may be an email (fine for `docker login`, invalid in an image name).
      # Defaults to the GitHub owner; override with repo variable DOCKERHUB_NAMESPACE
      # if your Docker Hub user/org name is different.
      - name: Resolve Docker Hub image name
        id: img
        env:
          NS: ${{ vars.DOCKERHUB_NAMESPACE || github.repository_owner }}
        run: |
          ns="$(printf '%s' "$NS" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          echo "name=${ns}/${IMAGE_PREFIX}${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          echo "Image name: ${ns}/${IMAGE_PREFIX}${{ matrix.service }}"

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      # --- 2. Build (load into the runner's Docker so we can scan it) ---
      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: ${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # --- 3. Scan the built image ---
      # CRITICAL (with a known fix) blocks the pipeline.
      - name: Trivy image scan - CRITICAL (blocking)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ matrix.service }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      # HIGH is reported for visibility but does not fail the build
      # (base-image OS CVEs depend on the distro's patch cadence).
      - name: Trivy image scan - HIGH (advisory)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ matrix.service }}:scan
          severity: HIGH
          ignore-unfixed: true
          exit-code: '0'
          format: table

      # --- 4. Push (skipped on pull requests) ---
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuses the layers built above - this step is near-instant.
          cache-from: type=gha,scope=${{ matrix.service }}
          # Plain image, no SLSA provenance/SBOM attestation manifests
          # (they need extra registry scope and aren't needed here).
          provenance: false
          sbom: false
          # platforms: linux/amd64,linux/arm64   # uncomment for multi-arch
