apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vote
  name: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
    namer: vote
    namespace: application
      labels:
        app: vote
    spec:
      containers:
      - image: 637423240208.dkr.ecr.us-east-1.amazonaws.com/637423240208.dkr.ecr.us-east-1.amazonaws.com/demo-app-vote
        name: vote
        ports:
        - containerPort: 80
          name: vote
